<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Editor 精修 · 零成本视频流水线</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0B0E14; --panel:#12161f; --line:#232a38; --fg:#F5F7FA; --dim:#9AA3B2; --accent:#08B6DD; --accent-2:#7C3AED; --ok:#22c55e; --err:#ef4444; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"Microsoft YaHei","PingFang SC",sans-serif; min-height:100vh; }
  .wrap { max-width:960px; margin:0 auto; padding:32px 24px 80px; }
  h1 { font-size:26px; margin-bottom:6px; }
  h1 .tag { font-size:13px; color:var(--accent); font-weight:400; margin-left:10px; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:24px; line-height:1.7; }
  a { color:var(--accent); text-decoration:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:24px; }
  .card h2 { font-size:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--dim); margin:10px 0 5px; }
  textarea, input[type=text], select {
    width:100%; background:#0d111a; color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; outline:none;
  }
  textarea:focus, input:focus, select:focus { border-color:var(--accent); }
  textarea { min-height:52px; resize:vertical; line-height:1.6; }
  .row { display:flex; gap:12px; } .row > * { flex:1; }
  @media (max-width:720px){ .row { flex-direction:column; gap:0; } }
  button.primary {
    border:none; border-radius:10px; padding:11px 30px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2)); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  button.primary:disabled { opacity:.45; cursor:not-allowed; }
  button.mini { border:1px solid var(--line); background:#161b26; color:var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:13px; white-space:nowrap; }
  button.mini:hover { border-color:var(--accent); }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; background:#1b2433; color:var(--dim); }
  .badge.ok { background:rgba(34,197,94,.15); color:var(--ok); }
  .badge.warn { background:rgba(239,68,68,.14); color:#f87171; }
  .dim { color:var(--dim); font-size:12px; }
  .err { color:var(--err); font-size:13px; margin-top:8px; line-height:1.6; }
  .okmsg { color:var(--ok); font-size:13px; margin-top:8px; line-height:1.6; }
  .shotcard { border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; background:#0d111a; }
  .shotcard.chg { border-color:var(--accent); }
  .sc-head { display:flex; gap:8px; align-items:center; margin-bottom:2px; flex-wrap:wrap; }
  .sc-head .chgmark { color:var(--accent-2); font-size:12px; font-weight:700; display:none; }
  .shotcard.chg .sc-head .chgmark { display:inline; }
  .cnt { float:right; color:var(--dim); font-size:12px; }
  .items { display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }
  .itemrow { display:flex; gap:6px; align-items:center; }
  .itemrow input { flex:1; }
  .itemrow input.idesc { flex:1.4; }
  .savebar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .savebar label { margin:0; display:flex; align-items:center; gap:7px; font-size:13px; }
  .savebar input[type=checkbox] { accent-color:var(--accent); width:15px; height:15px; }
  #saveMsg { flex:1; min-width:200px; }
  #runStat { font-size:13px; margin-top:10px; color:var(--dim); line-height:1.7; }
  #runStat.ok { color:var(--ok); } #runStat.err { color:var(--err); }
  #taskInfo { margin-top:12px; font-size:13px; color:var(--dim); line-height:1.9; }
  #taskInfo .badge { margin-right:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Editor 精修 <span class="tag">轻改 · 回写 shots.json 走局部重跑（两段式第一段）</span></h1>
  <div class="sub">改口播 / 换素材 / 调字段 → 保存并重跑。口播没动就不重新配音（省额度，只到第 2 步）；口播动了硬钳到第 1 步（旧音频对不上新词，宁钳不赌）。轻改边界：<b>不增删镜头、不动顺序</b>——拖动裁剪拆分属「重剪」段，另行立项。每次保存前自动备份 <code>shots.json.bak</code>。<a href="/">← 回控制台</a></div>

  <div class="card">
    <h2>① 选任务</h2>
    <div class="row">
      <div><select id="task"></select></div>
      <div style="flex:0 0 auto"><button class="mini" id="loadBtn" onclick="load()">载入分镜</button></div>
    </div>
    <div id="taskInfo"></div>
  </div>

  <div class="card" id="editCard" style="display:none">
    <h2>② 镜头编辑 <span class="badge" id="diffCount" style="display:none"></span></h2>
    <div id="shotList"></div>
    <div class="savebar">
      <label><input type="checkbox" id="doRerun" checked> 保存后自动重跑</label>
      <button class="primary" id="saveBtn" onclick="save()">保存</button>
      <span id="saveMsg" class="dim"></span>
    </div>
    <div id="runStat"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
async function j(url, opt) {
  const r = await fetch(url, opt);
  const t = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(t.error || ('HTTP ' + r.status));
  return t;
}

const TYPE_LABELS = { title:'标题卡', bullet:'要点卡', split:'左文右图', keyword:'砸字', transition:'章节转场', end:'收尾卡' };
let cur = null;        // { name, shots:{...}, assets, types, ... }
let dirty = [];        // 每镜是否已改
let pollT = null;

async function init() {
  try {
    const tasks = await j('/api/tasks');
    $('task').innerHTML = tasks.length
      ? tasks.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')
      : '<option value="">（还没有任务）</option>';
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash && tasks.some((t) => t.name === hash)) $('task').value = hash;
    else if (tasks.length) load();
  } catch (e) { $('taskInfo').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function load() {
  const name = $('task').value;
  if (!name) return;
  if (cur && cur.name === name && dirty.some(Boolean) && !confirm('有未保存改动，重新载入会丢弃。继续？')) return;
  try {
    cur = await j('/api/editor/shots?name=' + encodeURIComponent(name));
    history.replaceState(null, '', '#' + encodeURIComponent(name));
    dirty = cur.shots.shots.map(() => false);
    render();
    $('saveMsg').textContent = '';
    if (cur.busy) startPoll('载入时已有任务在跑');
  } catch (e) { $('saveMsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

function render() {
  const s = cur.shots;
  const sz = [s.platform ? ('平台 ' + s.platform) : '', s.width && s.height ? `${s.width}×${s.height}` : '', s.sceneStyle ? '风格 ' + s.sceneStyle : '', s.captions === false ? '无字幕' : '字幕开'].filter(Boolean);
  $('taskInfo').innerHTML =
    `<span class="badge">${s.shots.length} 镜</span>${sz.map((x) => `<span class="badge">${esc(x)}</span>`).join('')}`
    + (s.targetCharsPerSec ? `<span class="badge">语速 ${s.targetCharsPerSec} 字/秒</span>` : '')
    + (cur.narrationDrift ? '<span class="badge warn">口播相对音频有漂移（上次配音后改过）</span>' : '')
    + (cur.busy ? '<span class="badge warn">任务运行中——保存需等它完成</span>' : '')
    + `<div class="dim">画幅/平台/风格等任务级参数在控制台「局部重跑」面板改；这里只管镜头字段。素材文件（asset / media）从任务 assets/ 选用，先在控制台传入。</div>`;
  $('shotList').innerHTML = s.shots.map((sh, i) => cardHTML(sh, i)).join('');
  s.shots.forEach((sh, i) => { if (dirty[i]) $shotCard(i)?.classList.add('chg'); });
  $('editCard').style.display = '';
  updateDiff();
}
function $shotCard(i) { return $('shotList').querySelector(`[data-card="${i}"]`); }

function opts(list, val) { return list.map((x) => `<option value="${esc(x)}" ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join(''); }
function assetSel(k, i, val, hint) {
  const files = cur.assets || [];
  return `<select data-i="${i}" data-k="${k}"><option value="">${hint}</option>`
    + files.map((f) => `<option value="${esc(f)}" ${f === val ? 'selected' : ''}>${esc(f)}</option>`).join('')
    + '</select>';
}
function itemsHTML(sh, i) {
  const list = Array.isArray(sh.items) ? sh.items : [];
  return `<label>要点 items（一条一行；双行卡：标题 + 描述两格）</label>
  <div class="items" data-items="${i}">
    ${list.map((it, jj) => {
      const isObj = it && typeof it === 'object';
      const t = isObj ? (it.t || '') : String(it ?? '');
      const d = isObj ? (it.d || '') : '';
      return `<div class="itemrow">
        <input type="text" data-i="${i}" data-j="${jj}" data-r="t" value="${esc(t)}" placeholder="条目（建议≤10字）">
        <input type="text" class="idesc" data-i="${i}" data-j="${jj}" data-r="d" value="${esc(d)}" placeholder="描述（可空=单行）">
        <button class="mini" data-delj="${i}:${jj}">×</button>
      </div>`;
    }).join('')}
    <div><button class="mini" data-addi="${i}">＋ 加一条</button></div>
  </div>`;
}
function cardHTML(sh, i) {
  const t = sh.type || 'bullet';
  const idn = sh.id ? `id ${sh.id}` : (sh.n != null ? `n ${sh.n}` : '');
  let sp = '';
  if (t === 'title') sp = `
    <label>主标题 title</label><input type="text" data-i="${i}" data-k="title" value="${esc(sh.title || '')}">
    <label>副标题 subtitle（可换行）</label><textarea rows="2" data-i="${i}" data-k="subtitle">${esc(sh.subtitle || '')}</textarea>
    <div class="row"><div><label>徽标小字 kicker</label><input type="text" data-i="${i}" data-k="kicker" value="${esc(sh.kicker || '')}"></div>
    <div><label>导航标签 nav</label><input type="text" data-i="${i}" data-k="nav" value="${esc(sh.nav || '')}"></div></div>
    <label>标签行 tags（一条一行）</label><textarea rows="2" data-i="${i}" data-k="tags">${esc((sh.tags || []).join('\n'))}</textarea>`;
  else if (t === 'end') sp = `
    <label>收尾金句 title</label><input type="text" data-i="${i}" data-k="title" value="${esc(sh.title || '')}">
    <label>CTA subtitle（可换行）</label><textarea rows="2" data-i="${i}" data-k="subtitle">${esc(sh.subtitle || '')}</textarea>
    <label>标签/按钮行 tags（一条一行）</label><textarea rows="2" data-i="${i}" data-k="tags">${esc((sh.tags || []).join('\n'))}</textarea>
    <label>导航标签 nav</label><input type="text" data-i="${i}" data-k="nav" value="${esc(sh.nav || '')}">`;
  else if (t === 'bullet') sp = `
    <div class="row"><div><label>小标题 heading</label><input type="text" data-i="${i}" data-k="heading" value="${esc(sh.heading || '')}"></div>
    <div><label>导航标签 nav</label><input type="text" data-i="${i}" data-k="nav" value="${esc(sh.nav || '')}"></div></div>
    ${itemsHTML(sh, i)}
    <label>青色引用行 quote（可空）</label><input type="text" data-i="${i}" data-k="quote" value="${esc(sh.quote || '')}">`;
  else if (t === 'split') sp = `
    <div class="row"><div><label>左栏小标题 heading</label><input type="text" data-i="${i}" data-k="heading" value="${esc(sh.heading || '')}"></div>
    <div><label>分栏配图 media（必选）</label>${assetSel('media', i, sh.media || '', '（未选）')}</div></div>
    ${itemsHTML(sh, i)}
    <label>一行短注 note（与 items 至少一项）</label><input type="text" data-i="${i}" data-k="note" value="${esc(sh.note || '')}">
    <label>导航标签 nav</label><input type="text" data-i="${i}" data-k="nav" value="${esc(sh.nav || '')}">`;
  else if (t === 'keyword') sp = `
    <div class="row"><div><label>大字关键词 keyword（必填）</label><input type="text" data-i="${i}" data-k="keyword" value="${esc(sh.keyword || '')}"></div>
    <div><label>导航标签 nav</label><input type="text" data-i="${i}" data-k="nav" value="${esc(sh.nav || '')}"></div></div>
    <label>一行注解 note（可空）</label><input type="text" data-i="${i}" data-k="note" value="${esc(sh.note || '')}">`;
  else sp = `
    <div class="row"><div><label>章节编号 index（如 02）</label><input type="text" data-i="${i}" data-k="index" value="${esc(sh.index || '')}"></div>
    <div><label>章节名 heading</label><input type="text" data-i="${i}" data-k="heading" value="${esc(sh.heading || '')}"></div>
    <div><label>导航标签 nav</label><input type="text" data-i="${i}" data-k="nav" value="${esc(sh.nav || '')}"></div></div>`;
  return `<div class="shotcard" data-card="${i}">
    <div class="sc-head"><span class="badge">#${i + 1}</span><span class="badge">${esc(TYPE_LABELS[t] || t)}</span><span class="dim">${esc(idn)}</span><span class="chgmark">● 已改</span></div>
    <label>口播 narration <span class="cnt" data-cnt="${i}">${String(sh.narration || '').length} 字</span></label>
    <textarea rows="2" data-i="${i}" data-k="narration">${esc(sh.narration || '')}</textarea>
    <div class="row">
      <div><label>类型</label><select data-i="${i}" data-k="type">${cur.types.map((x) => `<option value="${x}" ${x === t ? 'selected' : ''}>${esc(TYPE_LABELS[x] || x)}</option>`).join('')}</select></div>
      <div><label>素材镜头 asset（assets/ 文件名，空 = 生成场景）</label>${assetSel('asset', i, sh.asset || '', '（无·生成场景）')}</div>
    </div>
    ${sp}
  </div>`;
}

function markDirty(i) {
  if (!dirty[i]) { dirty[i] = true; $shotCard(i)?.classList.add('chg'); updateDiff(); }
}
function updateDiff() {
  const n = dirty.filter(Boolean).length;
  $('diffCount').style.display = n ? '' : 'none';
  $('diffCount').textContent = `${n} 镜有改动`;
}
function renderItems(i) {
  const box = $('shotList').querySelector(`[data-items="${i}"]`);
  if (box) box.outerHTML = itemsHTML(cur.shots.shots[i], i);
}

// —— 事件委托 ——
$('shotList').addEventListener('input', (e) => {
  const el = e.target, i = +el.dataset.i;
  const sh = cur.shots.shots[i];
  if (!sh || Number.isNaN(i)) return;
  if (el.dataset.r) { // items 某格
    const jj = +el.dataset.j;
    const row = el.closest('.itemrow');
    const t = row.querySelector('[data-r="t"]').value;
    const d = row.querySelector('[data-r="d"]').value;
    sh.items[jj] = d.trim() && t.trim() ? { t, d } : t;
    markDirty(i); return;
  }
  const k = el.dataset.k;
  if (!k) return;
  if (k === 'type') { sh.type = el.value; markDirty(i); render(); return; }
  if (k === 'tags') sh.tags = el.value.split('\n').map((x) => x.trim()).filter(Boolean);
  else sh[k] = el.value;
  if (k === 'narration') { const c = $('shotList').querySelector(`[data-cnt="${i}"]`); if (c) c.textContent = el.value.length + ' 字'; }
  markDirty(i);
});
$('shotList').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  e.preventDefault();
  if (b.dataset.addi != null) {
    const i = +b.dataset.addi;
    const sh = cur.shots.shots[i];
    if ((sh.items || []).length >= 10) { flash('每镜最多 10 条要点', true); return; }
    sh.items = (sh.items || []).concat(['']);
    markDirty(i); renderItems(i);
  } else if (b.dataset.delj != null) {
    const [i, jj] = b.dataset.delj.split(':').map(Number);
    cur.shots.shots[i].items.splice(jj, 1);
    markDirty(i); renderItems(i);
  }
});
function flash(msg, isErr) {
  $('saveMsg').innerHTML = `<span class="${isErr ? 'err' : 'okmsg'}">${esc(msg)}</span>`;
}

async function save() {
  if (!cur) return;
  const rerun = $('doRerun').checked;
  $('saveBtn').disabled = true;
  flash(rerun ? '保存并排队重跑…' : '保存…');
  try {
    const r = await j('/api/editor/shots', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: cur.name, shots: cur.shots.shots, rerun }),
    });
    const driftNote = r.narrationDrift ? '口播相对音频有漂移' : '口播未动';
    if (r.rerun) {
      flash(`✓ 已保存（${driftNote}）· 备份 shots.json.bak · 已排队从第 ${r.rerun.from} 步重跑${r.narrationDrift ? '（含重新配音）' : '（免重新配音）'}`);
      dirty = cur.shots.shots.map(() => false);
      cur.shots.shots.forEach((_, i) => $shotCard(i)?.classList.remove('chg'));
      updateDiff();
      startPoll('刚保存，开始重跑');
    } else {
      flash(`✓ 已保存（${driftNote} · 建议 from ${r.from}）· 备份 shots.json.bak · 未重跑`);
      dirty = cur.shots.shots.map(() => false);
      cur.shots.shots.forEach((_, i) => $shotCard(i)?.classList.remove('chg'));
      updateDiff();
    }
  } catch (e) { flash('✗ ' + e.message, true); }
  $('saveBtn').disabled = false;
}

function startPoll(hint) {
  const el = $('runStat');
  el.className = ''; el.textContent = (hint ? hint + ' · ' : '') + '轮询中…';
  if (pollT) return;
  pollT = setInterval(async () => {
    try {
      const s = await j('/api/status');
      if (s.running) el.textContent = `⏳ 运行中：第 ${s.step}/6 ${s.stepName}${s.task ? ' · ' + s.task : ''} — <a href="/" target="_blank">控制台看日志</a>`;
      else if (s.queue && s.queue.length) el.textContent = `⏳ 排队中（${s.queue.length} 条）· ${s.task || ''}`;
      else { stopPoll(); el.className = 'ok'; el.innerHTML = '✓ 完成 — <a href="/" target="_blank">回控制台预览成片 / QC</a>（若改动涉及任务级参数，别忘了那步也要重跑）'; }
    } catch { /* 网络抖动继续轮 */ }
  }, 1500);
}
function stopPoll() { if (pollT) { clearInterval(pollT); pollT = null; } }

init();
</script>
</body>
</html>
