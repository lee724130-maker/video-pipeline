<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫画格排版 · 真人风格分镜/带货图</title>
<style>
  :root { --bg:#1c1e22; --panel:#26292f; --line:#3a3f47; --txt:#e6e8eb; --dim:#9aa3ad; --accent:#4c8dff; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  header { padding:11px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header a { color:var(--dim); text-decoration:none; font-size:13px; }
  header a:hover { color:var(--accent); }
  .note { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:400px 1fr; gap:0; height:calc(100vh - 53px); }
  aside { border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  .stage { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; overflow:auto; }
  canvas#view { background:#000; box-shadow:0 6px 30px rgba(0,0,0,.5); cursor:grab; max-width:100%; max-height:calc(100vh - 92px); width:auto; height:auto; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 12px; padding:10px 12px; }
  legend { padding:0 6px; color:var(--dim); font-size:12px; }
  label { display:block; margin:7px 0 3px; font-size:12px; color:var(--dim); }
  input[type=text], input[type=number], textarea, select { width:100%; background:#1a1d21; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  textarea { min-height:56px; resize:vertical; }
  input[type=range] { width:100%; }
  button { background:#333842; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 11px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.pri { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:#1f6f52; border-color:var(--ok); color:#fff; }
  button.sm { padding:3px 8px; font-size:12px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chk { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .chk input { width:auto; }
  .bub { border:1px solid var(--line); border-radius:7px; padding:8px; margin-bottom:8px; background:#1f2226; }
  .bub.sel { border-color:var(--accent); }
  .bub .hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-size:12px; color:var(--dim); }
  .hint { font-size:11px; color:var(--dim); line-height:1.5; }
  .tag { font-size:11px; background:#2f3742; border-radius:4px; padding:1px 6px; }
  #libGrid, #outGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px; }
  #libGrid img, #outGrid img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:4px; border:1px solid var(--line); cursor:pointer; display:block; }
  #libGrid img:hover, #outGrid img:hover { border-color:var(--accent); }
  .empty { color:var(--dim); font-size:12px; padding:6px 0; }
</style>
</head>
<body>
<header>
  <h1>漫画格排版</h1>
  <span class="tag">P21 · 排版层，不接生图模型</span>
  <a href="/">← 入口</a><a href="/console">控制台</a><a href="/cut">重剪</a><a href="/wizard">向导</a>
  <span class="note">拖动旁白框/气泡定位，拖右下角圆点改宽度；画布滚轮缩放底图，Alt+拖动移动底图</span>
</header>
<main>
<aside>
  <fieldset>
    <legend>底图 · 从素材库选</legend>
    <div class="row"><button id="libReload" class="sm">刷新素材库</button><input type="file" id="file" accept="image/*" style="flex:1"></div>
    <div id="libGrid"><div class="empty">加载中…</div></div>
    <label>铺法</label>
    <select id="fit"><option value="cover">cover 铺满裁切</option><option value="contain">contain 完整可见</option></select>
    <div class="grid2">
      <div><label>水平偏移 <span id="xv"></span></label><input type="range" id="offX" min="-0.6" max="0.6" step="0.01" value="0"></div>
      <div><label>垂直偏移 <span id="yv"></span></label><input type="range" id="offY" min="-0.6" max="0.6" step="0.01" value="0"></div>
    </div>
    <label>缩放 <span id="zoomv"></span></label><input type="range" id="zoom" min="0.2" max="4" step="0.01" value="1">
    <label>背景色（图缩小后露出的区域）</label><input type="color" id="bg" value="#101215" style="width:100%;height:30px;padding:2px">
  </fieldset>

  <fieldset>
    <legend>旁白框</legend>
    <div class="chk"><input type="checkbox" id="narOn" checked><label for="narOn" style="margin:0">启用</label></div>
    <textarea id="narText">当你被仙人选中，
选择一心向道时</textarea>
    <div class="grid2">
      <div><label>位置预设</label><select id="narPos"><option value="top">顶部</option><option value="bottom">底部</option></select></div>
      <div><label>主题</label><select id="narTheme"><option value="light">浅底深字</option><option value="dark">深底白字</option><option value="frost">磨砂半透</option></select></div>
    </div>
    <div class="grid2">
      <div><label>对齐</label><select id="narAlign"><option value="left">左对齐</option><option value="center">居中</option></select></div>
      <div><label>字色</label><input type="color" id="narFg" value="#15181c" style="width:100%;height:28px;padding:2px"></div>
    </div>
    <label>宽度 <span id="narWv"></span></label><input type="range" id="narW" min="0.3" max="0.98" step="0.01" value="0.86">
    <label>字号 <span id="narFv"></span></label><input type="range" id="narF" min="24" max="52" step="1" value="34">
    <label>不透明度 <span id="narAv"></span></label><input type="range" id="narA" min="0.3" max="1" step="0.02" value="0.92">
  </fieldset>

  <fieldset>
    <legend>对话气泡</legend>
    <div class="row"><button id="addBub" class="sm">+ 添加气泡</button><button id="delBub" class="sm">删除选中</button></div>
    <div id="bubs" style="margin-top:8px"></div>
  </fieldset>

  <fieldset>
    <legend>A/B/C 分支选项卡</legend>
    <div class="chk"><input type="checkbox" id="chOn"><label for="chOn" style="margin:0">整格改为选项卡（底图变暗）</label></div>
    <label>引导语</label><textarea id="chPrompt">小禾，你要照顾好自己。
等我修炼有成了，就回来看你。</textarea>
    <label>选项 A</label><textarea id="chA">我不去了。
我要留在这里，和你在一起。</textarea>
    <label>选项 B</label><textarea id="chB">仙凡有别。
你这样的凡人，
就别再和我攀交情了。</textarea>
    <label>选项 C</label><textarea id="chC">我愿意！仙长，
我愿意去！</textarea>
  </fieldset>

  <fieldset>
    <legend>导出</legend>
    <label>目标任务（产物写入 <code>output/任务/comic/</code>，不碰主链文件）</label>
    <div class="row"><select id="taskSel" style="flex:1"></select><button id="taskReload" class="sm">↻</button></div>
    <div class="grid2">
      <div><label>格号</label><input type="number" id="cellNo" min="1" max="999" value="1"></div>
      <div><label>文件名前缀</label><input type="text" id="cellPrefix" value="格" maxlength="20"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="png" class="pri">浏览器下载 PNG</button>
      <button id="toTask" class="ok">写入任务目录</button>
    </div>
    <div class="row"><button id="saveJson" class="sm">存剧本 JSON</button><button id="loadJson" class="sm">读剧本 JSON</button>
      <input type="file" id="jsonFile" accept="application/json" style="display:none"></div>
    <div class="row" style="margin-top:6px">
      <button id="svg" class="sm">导出 SVG（文字可编辑）</button>
      <button id="manifest" class="sm">存 text-manifest.json</button>
    </div>
    <div class="hint">SVG 里底图是位图层，旁白框/气泡/文字都是**矢量对象**：价格、卖点、台词可以在 Illustrator / Inkscape / PPT 里直接改字，不必回来重排。manifest 单独存文字内容与坐标，便于批量替换文案。</div>
    <div id="outMsg" class="hint"></div>
    <label>该任务已导出的格</label><div id="outGrid"><div class="empty">选择任务后加载</div></div>
  </fieldset>
</aside>

<section class="stage">
  <canvas id="view" width="1024" height="1536"></canvas>
  <div class="hint" id="stat"></div>
</section>
</main>

<script>
const W = 1024, H = 1536;
const cv = document.getElementById('view');
let ctx = cv.getContext('2d');
const S = {
  base: null,
  view: { fit: 'cover', x: 0, y: 0, zoom: 1, bg: '#101215' },
  nar: { on: true, text: '', pos: 'top', x: 0.5, y: 0.09, theme: 'light', w: 0.86, f: 34, a: 0.92, align: 'left', fg: '#15181c', _rect: null },
  bubs: [], sel: -1, selKind: 'none',
  ch: { on: false, prompt: '', a: '', b: '', c: '' },
};
const THEME = {
  light: { bg: '#ffffff', fg: '#15181c', stroke: 'rgba(0,0,0,.18)' },
  dark:  { bg: '#12161b', fg: '#f2f4f7', stroke: 'rgba(255,255,255,.22)' },
  frost: { bg: '#ffffff', fg: '#1b2027', stroke: 'rgba(255,255,255,.5)' },
};
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
let uid = 0;
const $ = (id) => document.getElementById(id);

function newBubble(text) {
  return { id: ++uid, text, x: 0.3, y: 0.28, w: 0.42, tx: 0.45, ty: 0.44,
           shape: 'ellipse', f: 32, a: 0.94, theme: 'light', align: 'center', fg: '#15181c', tight: 0.35 };
}

/* ---------- 文本换行与形状 ---------- */
function wrap(text, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  }
  return out;
}
function measure(text, size) { ctx.font = `${size}px ${FONT}`; return ctx.measureText(text).width; }
function drawTextBlock(lines, x, y, size, color, align) {
  ctx.font = `${size}px ${FONT}`; ctx.fillStyle = color; ctx.textBaseline = 'top';
  ctx.textAlign = align === 'center' ? 'center' : 'left';
  const lh = size * 1.42;
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
  ctx.textAlign = 'left';
  return lines.length * lh;
}
/** 量文字块：换行后返回真实行宽与总高，供形状外接文字（而不是把文字塞进形状里） */
function textBlock(text, maxW, size) {
  const lines = wrap(text, maxW, size);
  const w = lines.reduce((a, l) => Math.max(a, measure(l, size)), 0);
  return { lines, w, h: lines.length * size * 1.42, lh: size * 1.42 };
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function tailPoints(fromX, fromY, toX, toY, wid) {
  const ang = Math.atan2(toY - fromY, toX - fromX), per = ang + Math.PI / 2;
  return [
    [fromX + Math.cos(per) * wid, fromY + Math.sin(per) * wid],
    [toX, toY],
    [fromX - Math.cos(per) * wid, fromY - Math.sin(per) * wid],
  ];
}
function tail(fromX, fromY, toX, toY, wid) {
  const p = tailPoints(fromX, fromY, toX, toY, wid);
  ctx.beginPath();
  ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]); ctx.lineTo(p[2][0], p[2][1]);
  ctx.closePath(); ctx.fill();
}
function dot(x, y) { ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill(); }

/* ---------- 绘制 ---------- */
function drawBase() {
  ctx.fillStyle = S.view.bg; ctx.fillRect(0, 0, W, H);
  if (!S.base) {
    ctx.fillStyle = '#5a636e'; ctx.font = `28px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('从素材库选一张底图，或上传本地图片', W / 2, H / 2); ctx.textAlign = 'left'; return;
  }
  const img = S.base, v = S.view;
  const ratio = v.fit === 'contain' ? Math.min(W / img.width, H / img.height) : Math.max(W / img.width, H / img.height);
  const s = ratio * v.zoom, dw = img.width * s, dh = img.height * s;
  const dx = (W - dw) / 2 + v.x * W, dy = (H - dh) / 2 + v.y * H;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}
function drawChoices() {
  const c = S.ch; if (!c.on) { c._paint = null; return; }
  const blocks = [];
  c._paint = { overlay: 'rgba(8,10,13,.72)', f: 34, pad: 26, prompt: null, blocks };
  ctx.fillStyle = 'rgba(8,10,13,.72)'; ctx.fillRect(0, 0, W, H);
  const f = 34, pad = 26;
  let y = 150;
  const pl = wrap(c.prompt, W * 0.8 - pad * 2, f);
  ctx.globalAlpha = .95; ctx.fillStyle = '#f4f6f8'; rrect(W * 0.1, y - 14, W * 0.8, pl.length * f * 1.42 + 28, 12); ctx.fill(); ctx.globalAlpha = 1;
  c._paint.prompt = { rect: { x: W * 0.1, y: y - 14, w: W * 0.8, h: pl.length * f * 1.42 + 28 }, fill: '#f4f6f8', lines: pl, tx: W * 0.1 + pad, ty: y, fg: '#15181c' };
  y += drawTextBlock(pl, W * 0.1 + pad, y, f, '#15181c') + 40;
  [['A', c.a], ['B', c.b], ['C', c.c]].forEach(([k, txt]) => {
    if (!txt.trim()) return;
    const lines = wrap(txt, W * 0.72 - pad * 2, f), bh = lines.length * f * 1.42 + pad * 1.6;
    ctx.fillStyle = 'rgba(20,24,29,.92)'; rrect(W * 0.14, y, W * 0.72, bh, 14); ctx.fill();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3; ctx.stroke();
    ctx.font = `bold ${f}px ${FONT}`; ctx.fillStyle = '#e8c15a'; ctx.textBaseline = 'top';
    ctx.fillText(k + ':', W * 0.14 + pad * 0.5, y + pad * 0.8);
    blocks.push({ key: k, rect: { x: W * 0.14, y, w: W * 0.72, h: bh }, lines,
      label: { x: W * 0.14 + pad * 0.5, y: y + pad * 0.8, color: '#e8c15a' },
      text: { x: W * 0.14 + pad * 2.1, y: y + pad * 0.8, color: '#f0f2f5' } });
    drawTextBlock(lines, W * 0.14 + pad * 2.1, y + pad * 0.8, f, '#f0f2f5');
    y += bh + 26;
  });
}
function drawNarration(showHandles) {
  const n = S.nar; if (!n.on || !n.text.trim()) { n._rect = null; return; }
  const t = THEME[n.theme], pad = n.f * 0.62, bw = W * n.w;
  const box = textBlock(n.text, bw - pad * 2, n.f);
  const lines = box.lines, lh = box.lh, bh = lines.length * lh + pad * 2;
  const bx = Math.max(8, Math.min(W - bw - 8, n.x * W - bw / 2));
  const by = Math.max(8, Math.min(H - bh - 8, n.y * H - bh / 2));
  n._rect = { x: bx, y: by, w: bw, h: bh };
  ctx.globalAlpha = n.a; ctx.fillStyle = t.bg; rrect(bx, by, bw, bh, 10); ctx.fill();
  ctx.globalAlpha = Math.min(1, n.a + 0.05); ctx.strokeStyle = t.stroke; ctx.lineWidth = 2; ctx.stroke();
  ctx.globalAlpha = 1;
  const nx = n.align === 'center' ? bx + bw / 2 : bx + pad;
  n._paint = { lines, lh, f: n.f, fg: n.fg || t.fg, align: n.align || 'left', tx: nx, ty: by + pad, pad };
  drawTextBlock(lines, nx, by + pad, n.f, n.fg || t.fg, n.align);
  if (showHandles && S.selKind === 'nar') {
    ctx.strokeStyle = '#4c8dff'; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
    ctx.strokeRect(bx - 6, by - 6, bw + 12, bh + 12); ctx.setLineDash([]);
    ctx.fillStyle = '#4c8dff'; dot(bx + bw, by + bh);
  }
}
function drawBubbles(showHandles) {
  const SQ2 = Math.SQRT2, SAFE = 1.06;
  S.bubs.forEach((b, i) => {
    const t = THEME[b.theme], padH = b.f * 0.62, padV = b.f * 0.5;
    // 文本框模型：「宽度」滑条决定换行宽度；「紧凑度」决定形状贴不贴文字。
    // tight=1 形状贴最长行（短文字不会框大字少），tight=0 形状铺满框宽（对齐差别最明显）。
    const innerW = Math.max(b.f * 2, W * b.w - padH * 2);
    const tb = textBlock(b.text, innerW, b.f);
    const tight = (typeof b.tight === 'number') ? Math.min(1, Math.max(0, b.tight)) : 0.35;
    const usedW = tb.w + (innerW - tb.w) * (1 - tight);
    const lines = tb.lines, textH = tb.h;
    const cx = b.x * W, cy = b.y * H;
    // 形状外接「实际用宽」而非最长行：椭圆内接矩形半宽只有 A/√2，故 A=√2·(usedW/2+padH)
    let sw, sh;
    if (b.shape === 'ellipse') { sw = SQ2 * (usedW / 2 + padH) * SAFE * 2; sh = SQ2 * (textH / 2 + padV) * SAFE * 2; }
    else { sw = usedW + padH * 2; sh = textH + padV * 2; }
    const fg = b.fg || t.fg;
    ctx.globalAlpha = b.a; ctx.fillStyle = t.bg;
    if (b.shape === 'ellipse') {
      ctx.beginPath(); ctx.ellipse(cx, cy, sw / 2, sh / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = t.stroke; ctx.lineWidth = 2; ctx.stroke();
    } else if (b.shape === 'rect') { rrect(cx - sw / 2, cy - sh / 2, sw, sh, 22); ctx.fill(); ctx.strokeStyle = t.stroke; ctx.lineWidth = 2; ctx.stroke(); }
    else { rrect(cx - sw / 2, cy - sh / 2, sw, sh, sh / 2); ctx.fill(); ctx.strokeStyle = t.stroke; ctx.lineWidth = 2; ctx.stroke(); }
    if (b.shape !== 'whisper') { ctx.fillStyle = t.bg; tail(cx, cy, b.tx * W, b.ty * H, Math.min(sw, sh) * 0.11); }
    ctx.globalAlpha = 1;
    const tx = b.align === 'center' ? cx : cx - usedW / 2;
    b._paint = {
      shape: b.shape, cx, cy, sw, sh, f: b.f, lh: b.f * 1.42, fg,
      align: b.align || 'center', tx, ty: cy - textH / 2, lines, alpha: b.a,
      tail: b.shape !== 'whisper' ? tailPoints(cx, cy, b.tx * W, b.ty * H, Math.min(sw, sh) * 0.11) : null,
    };
    drawTextBlock(lines, tx, cy - textH / 2, b.f, fg, b.align);
    b._rect = { x: cx - sw / 2, y: cy - sh / 2, w: sw, h: sh };
    b._text = { w: usedW, h: textH };   // 供冒烟用椭圆方程验角点包含：(tw/2)²/A² + (th/2)²/B² ≤ 1
    if (showHandles && i === S.sel && S.selKind === 'bub') {
      ctx.strokeStyle = '#4c8dff'; ctx.lineWidth = 2; ctx.setLineDash([7, 5]);
      ctx.strokeRect(cx - sw / 2 - 6, cy - sh / 2 - 6, sw + 12, sh + 12); ctx.setLineDash([]);
      ctx.fillStyle = '#4c8dff'; dot(cx, cy); ctx.fillStyle = '#ffb020'; dot(b.tx * W, b.ty * H);
    }
  });
}
function render() {
  drawBase(); drawChoices(); drawNarration(true); drawBubbles(true);
  $('stat').textContent = `${W}×${H} · 底图${S.base ? S.base.width + '×' + S.base.height : '未选'} · 气泡 ${S.bubs.length} · 选中：${S.selKind === 'nar' ? '旁白框' : S.selKind === 'bub' && S.sel >= 0 ? '气泡 #' + (S.sel + 1) : '无'}`;
}

/* ---------- 气泡列表面板 ---------- */
function bubbleList() {
  const box = $('bubs'); box.innerHTML = '';
  S.bubs.forEach((b, i) => {
    const d = document.createElement('div'); d.className = 'bub' + (i === S.sel && S.selKind === 'bub' ? ' sel' : '');
    d.innerHTML = `<div class="hd"><span>气泡 #${i + 1}</span><button class="sm" data-sel="${i}">选中</button></div>
      <textarea data-k="text" data-i="${i}">${b.text}</textarea>
      <div class="grid2" style="margin-top:6px">
        <div><label>形状</label><select data-k="shape" data-i="${i}">
          <option value="ellipse">椭圆气泡</option><option value="rect">方角气泡</option><option value="whisper">无尾白框</option></select></div>
        <div><label>主题</label><select data-k="theme" data-i="${i}">

      </div>

        <div><label>字色</label><input type="color" data-k="fg" data-i="${i}" value="${b.fg || '#15181c'}" style="width:100%;height:28px;padding:2px"></div>
      </div>

      <label>紧凑度（1=贴文字 / 0=铺满框宽）</label><input type="range" data-k="tight" data-i="${i}" min="0" max="1" step="0.05" value="${typeof b.tight === 'number' ? b.tight : 0.35}">
      <label>不透明度</label><input type="range" data-k="a" data-i="${i}" min="0.4" max="1" step="0.02" value="${b.a}">`;
    d.querySelector('[data-k=shape]').value = b.shape; d.querySelector('[data-k=theme]').value = b.theme;
    d.querySelector('[data-k=align]').value = b.align || 'center';
    box.appendChild(d);
  });

    const b = S.bubs[+el.dataset.i]; if (!b) return;

}

/* ---------- 画布交互 ---------- */
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function bubbleHit(p) {
  for (let i = S.bubs.length - 1; i >= 0; i--) {
    const b = S.bubs[i];
    if (Math.hypot(p.x - b.tx * W, p.y - b.ty * H) < 22) return { i, part: 'tail' };
    const r = b._rect; if (!r) continue;
    if (p.x >= r.x - 8 && p.x <= r.x + r.w + 8 && p.y >= r.y - 8 && p.y <= r.y + r.h + 8) return { i, part: 'body' };
  }
  return null;
}
function narHit(p) {
  const r = S.nar._rect; if (!r) return null;
  if (Math.hypot(p.x - (r.x + r.w), p.y - (r.y + r.h)) < 24) return { part: 'nar-size' };
  if (p.x >= r.x - 6 && p.x <= r.x + r.w + 6 && p.y >= r.y - 6 && p.y <= r.y + r.h + 6) return { part: 'nar-body' };
  return null;
}
let drag = null;
cv.addEventListener('pointerdown', (e) => {
  const p = toCanvas(e);
  if (e.altKey && S.base) { drag = { part: 'image', ox: p.x / W - S.view.x, oy: p.y / H - S.view.y }; e.preventDefault(); return; }
  const bh = bubbleHit(p);
  if (bh) {
    drag = { i: bh.i, part: (bh.part === 'tail' || e.shiftKey) ? 'tail' : 'body' };
    S.sel = bh.i; S.selKind = 'bub'; bubbleList(); render(); return;
  }
  const nh = narHit(p);
  if (nh) {
    drag = nh.part === 'nar-size'
      ? { part: 'nar-size', startW: S.nar.w, startX: p.x }
      : { part: 'nar-body', ox: p.x / W - S.nar.x, oy: p.y / H - S.nar.y };
    S.sel = -1; S.selKind = 'nar'; bubbleList(); render(); return;
  }
  S.sel = -1; S.selKind = 'none'; bubbleList(); render();
});
cv.addEventListener('pointermove', (e) => {
  if (!drag) return; const p = toCanvas(e);
  if (drag.part === 'image') {
    S.view.x = Math.max(-0.6, Math.min(0.6, p.x / W - drag.ox));
    S.view.y = Math.max(-0.6, Math.min(0.6, p.y / H - drag.oy));
    $('offX').value = S.view.x; $('offY').value = S.view.y; viewLabels(); render(); return;
  }
  if (drag.part === 'nar-body') {
    S.nar.x = Math.max(0.05, Math.min(0.95, p.x / W - drag.ox));
    S.nar.y = Math.max(0.03, Math.min(0.97, p.y / H - drag.oy));
    render(); return;
  }
  if (drag.part === 'nar-size') {
    S.nar.w = Math.max(0.3, Math.min(0.98, drag.startW + (p.x - drag.startX) / W));
    $('narW').value = S.nar.w; $('narWv').textContent = Math.round(S.nar.w * 100) + '%'; render(); return;
  }
  const b = S.bubs[drag.i]; if (!b) return;
  if (drag.part === 'tail') { b.tx = p.x / W; b.ty = p.y / H; } else { b.x = p.x / W; b.y = p.y / H; }
  render();
});
cv.addEventListener('wheel', (e) => {
  if (!S.base) return; e.preventDefault();
  S.view.zoom = Math.max(0.2, Math.min(4, S.view.zoom * (e.deltaY < 0 ? 1.06 : 0.94)));
  $('zoom').value = S.view.zoom; viewLabels(); render();
}, { passive: false });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => { drag = null; }));

/* ---------- P22：矢量导出（文字保持可编辑） ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function baseLayerDataUrl() {
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const live = ctx; ctx = off.getContext('2d');
  drawBase();
  ctx = live;
  return off.toDataURL('image/png');
}
/** SVG 的 text y 是基线，canvas 的 textBaseline=top 是字顶 —— 用真实字体度量换算，别硬编系数 */
function baselineOffset(size) {
  ctx.font = `${size}px ${FONT}`; ctx.textBaseline = 'top';
  const m = ctx.measureText('国');
  return (m.actualBoundingBoxAscent || size * 0.8) + 0.5;
}
function svgTextEl(p, idBase) {
  const anchor = p.align === 'center' ? 'middle' : 'start';
  const dy = p.lh;
  const bo = baselineOffset(p.f);
  const tspans = p.lines.map((l, i) =>
    `<tspan x="${p.tx.toFixed(1)}" y="${(p.ty + bo + i * dy).toFixed(1)}">${esc(l)}</tspan>`).join('');
  return `<text id="${idBase}" font-family="${esc(FONT)}" font-size="${p.f}" fill="${esc(p.fg)}" text-anchor="${anchor}">${tspans}</text>`;
}
function buildSvg() {
  render();   // 确保 _paint 是最新几何
  const parts = [`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`];
  parts.push(`<image x="0" y="0" width="${W}" height="${H}" href="${baseLayerDataUrl()}"/>`);
  const c = S.ch._paint;
  if (c) {
    parts.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="${esc(c.overlay)}"/>`);
    if (c.prompt) {
      const r = c.prompt.rect;
      parts.push(`<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${r.w.toFixed(1)}" height="${r.h.toFixed(1)}" rx="12" fill="${esc(c.prompt.fill)}"/>`);
      parts.push(svgTextEl(c.prompt, 'ch-prompt'));
    }
    c.blocks.forEach((bl, i) => {
      parts.push(`<rect x="${bl.rect.x.toFixed(1)}" y="${bl.rect.y.toFixed(1)}" width="${bl.rect.w.toFixed(1)}" height="${bl.rect.h.toFixed(1)}" rx="14" fill="#14181d" fill-opacity="0.92" stroke="#c9a227" stroke-width="3"/>`);
      const bo = baselineOffset(c.f);
      parts.push(`<text font-family="${esc(FONT)}" font-size="${c.f}" font-weight="bold" fill="${esc(bl.label.color)}"><tspan x="${bl.label.x.toFixed(1)}" y="${(bl.label.y + bo).toFixed(1)}">${esc(bl.key)}:</tspan></text>`);
      const tspans = bl.lines.map((l, k) => `<tspan x="${bl.text.x.toFixed(1)}" y="${(bl.text.y + bo + k * c.f * 1.42).toFixed(1)}">${esc(l)}</tspan>`).join('');
      parts.push(`<text id="ch-opt-${bl.key}" font-family="${esc(FONT)}" font-size="${c.f}" fill="${esc(bl.text.color)}">${tspans}</text>`);
    });
  }
  const n = S.nar;
  if (n.on && n._paint && n._paint.lines.length) {
    const r = n._rect;
    parts.push(`<g id="narration" opacity="${n.a}">`);
    parts.push(`<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${r.w.toFixed(1)}" height="${r.h.toFixed(1)}" rx="10" fill="${esc(THEME[n.theme].bg)}" stroke="${esc(THEME[n.theme].stroke)}" stroke-width="2"/>`);
    parts.push(svgTextEl(n._paint, 'narration-text'));
    parts.push('</g>');
  }
  S.bubs.forEach((b, i) => {
    if (!b._paint) return;
    const p = b._paint, bg = esc(THEME[b.theme].bg), st = esc(THEME[b.theme].stroke);
    parts.push(`<g id="bubble-${i + 1}" opacity="${p.alpha}">`);
    if (p.tail) parts.push(`<polygon points="${p.tail.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}" fill="${bg}"/>`);
    if (p.shape === 'ellipse') parts.push(`<ellipse cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" rx="${(p.sw / 2).toFixed(1)}" ry="${(p.sh / 2).toFixed(1)}" fill="${bg}" stroke="${st}" stroke-width="2"/>`);
    else {
      const rx = p.shape === 'rect' ? 22 : p.sh / 2;
      parts.push(`<rect x="${(p.cx - p.sw / 2).toFixed(1)}" y="${(p.cy - p.sh / 2).toFixed(1)}" width="${p.sw.toFixed(1)}" height="${p.sh.toFixed(1)}" rx="${rx.toFixed(1)}" fill="${bg}" stroke="${st}" stroke-width="2"/>`);
    }
    parts.push(svgTextEl(p, `bubble-${i + 1}-text`));
    parts.push('</g>');
  });
  parts.push('</svg>');
  return parts.join('\n');
}
function buildManifest() {
  render();
  const layers = [];
  if (S.nar.on && S.nar._paint) layers.push({
    kind: 'narration', text: S.nar.text, lines: S.nar._paint.lines,
    rect: S.nar._rect, font: { size: S.nar.f, lineHeight: +(S.nar.f * 1.42).toFixed(2), color: S.nar._paint.fg, align: S.nar.align },
    theme: S.nar.theme, opacity: S.nar.a,
  });
  S.bubs.forEach((b, i) => {
    if (!b._paint) return;
    layers.push({
      kind: 'bubble', id: i + 1, text: b.text, lines: b._paint.lines, rect: b._rect,
      font: { size: b.f, lineHeight: +(b.f * 1.42).toFixed(2), color: b._paint.fg, align: b.align },
      shape: b.shape, theme: b.theme, opacity: b.a,
      anchor: { x: +(b.x).toFixed(4), y: +(b.y).toFixed(4), tailX: +(b.tx).toFixed(4), tailY: +(b.ty).toFixed(4) },
    });
  });
  if (S.ch.on && S.ch._paint) {
    layers.push({ kind: 'choice-prompt', text: S.ch.prompt, lines: S.ch._paint.prompt ? S.ch._paint.prompt.lines : [], rect: S.ch._paint.prompt ? S.ch._paint.prompt.rect : null });
    S.ch._paint.blocks.forEach(bl => layers.push({ kind: 'choice-option', key: bl.key, text: S.ch[bl.key.toLowerCase()], lines: bl.lines, rect: bl.rect }));
  }
  return { version: 1, canvas: { width: W, height: H }, background: S.view.bg, base: { hasImage: !!S.base, fit: S.view.fit, x: +S.view.x.toFixed(4), y: +S.view.y.toFixed(4), zoom: +S.view.zoom.toFixed(3) }, layers };
}
function dl(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime })); a.download = name; a.click();
}
$('svg').onclick = () => {
