<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>重剪时间轴 · 零成本视频流水线</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0B0E14; --panel:#12161f; --line:#232a38; --fg:#F5F7FA; --dim:#9AA3B2; --accent:#08B6DD; --accent-2:#7C3AED; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"Microsoft YaHei","PingFang SC",sans-serif; min-height:100vh; }
  .wrap { max-width:1380px; margin:0 auto; padding:22px 22px 120px; }
  h1 { font-size:23px; margin-bottom:4px; }
  h1 .tag { font-size:12px; color:var(--accent); font-weight:400; margin-left:10px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:16px; line-height:1.7; }
  a { color:var(--accent); text-decoration:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--dim); margin:8px 0 4px; }
  select, input[type=text], input[type=number] { width:100%; background:#0d111a; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13px; font-family:inherit; outline:none; }
  select:focus, input:focus { border-color:var(--accent); }
  button { font-family:inherit; }
  .mini { border:1px solid var(--line); background:#161b26; color:var(--fg); border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; }
  .mini:hover { border-color:var(--accent); }
  .mini:disabled { opacity:.4; cursor:not-allowed; }
  .mini.accent { color:var(--accent); border-color:rgba(8,182,221,.45); }
  .mini.danger:hover { border-color:var(--err); color:#f87171; }
  button.primary { border:none; border-radius:11px; padding:11px 26px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button.primary:disabled { opacity:.45; cursor:not-allowed; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; background:#1b2433; color:var(--dim); margin-right:6px; }
  .badge.ok { background:rgba(34,197,94,.15); color:var(--ok); }
  .badge.warn { background:rgba(245,158,11,.15); color:var(--warn); }
  .badge.err { background:rgba(239,68,68,.15); color:#f87171; }
  .row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; } .row > .grow { flex:1; min-width:180px; }
  /* 时间轴 */
  .tlwrap { overflow-x:auto; padding-bottom:6px; }
  .tlbody { position:relative; }
  .ruler { position:relative; height:18px; border-bottom:1px dashed var(--line); margin:0 0 4px 56px; }
  .tick { position:absolute; top:2px; font-size:10px; color:var(--dim); border-left:1px solid var(--line); padding-left:3px; height:14px; line-height:14px; }
  .track { display:flex; margin-bottom:7px; }
  .tracklab { position:sticky; left:0; z-index:3; width:56px; flex:0 0 56px; font-size:11px; color:var(--dim); display:flex; align-items:center; background:linear-gradient(90deg, var(--panel) 72%, transparent); }
  .clips { display:flex; flex:1; position:relative; }
  .clip { position:relative; border:1px solid var(--line); border-radius:9px; background:#0d111a; overflow:hidden; user-select:none; touch-action:none; min-width:26px; }
  .clip:hover { border-color:#3a4a63; }
  .clip.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .clip .head { display:flex; justify-content:space-between; padding:3px 6px 0; font-size:9.5px; color:var(--dim); }
  .clip .cap { padding:1px 6px; font-size:10.5px; line-height:1.4; color:var(--fg); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-all; }
  .clip .foot { position:absolute; left:6px; bottom:2px; font-size:9px; color:var(--dim); }
  .clip .tr { position:absolute; right:0; top:0; bottom:0; width:0; border-left:2px dashed rgba(8,182,221,.7); }
  .clip .trtag { position:absolute; right:3px; top:3px; font-size:8.5px; color:var(--accent); background:rgba(8,182,221,.12); border-radius:6px; padding:0 4px; }
  .grip { position:absolute; top:0; bottom:0; width:11px; cursor:ew-resize; z-index:2; }
  .grip.l { left:0; } .grip.r { right:0; }
  .grip:hover { background:rgba(8,182,221,.18); }
  .clip.dragging { opacity:.35; }
  .caret { position:absolute; top:-20px; bottom:0; width:2px; background:var(--accent); z-index:6; display:none; pointer-events:none; }
  .playhead { position:absolute; top:0; bottom:0; width:2px; background:rgba(239,68,68,.85); z-index:5; pointer-events:none; display:none; }
  .ty { font-size:8.5px; border-radius:6px; padding:0 4px; }
  .ty.title{background:rgba(8,182,221,.16);color:#4cc9ec}.ty.bullet{background:rgba(124,58,237,.18);color:#b794f6}
  .ty.split{background:rgba(34,197,94,.15);color:#5fd08a}.ty.keyword{background:rgba(245,158,11,.16);color:#fbbf24}
  .ty.transition{background:rgba(154,163,178,.15);color:#aab4c5}.ty.end{background:rgba(239,68,68,.14);color:#f87171}
  /* 属性面板 */
  .insp { display:grid; grid-template-columns:repeat(4,1fr); gap:0 14px; }
  @media (max-width:900px){ .insp { grid-template-columns:1fr 1fr; } }
  .hint { font-size:11px; color:var(--dim); }
  #bar { position:fixed; left:0; right:0; bottom:0; background:rgba(11,14,20,.94); backdrop-filter:blur(6px); border-top:1px solid var(--line); padding:11px 22px; z-index:9; }
  #bar .inner { max-width:1380px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #msg { font-size:13px; } #msg.err{color:var(--err)} #msg.ok{color:var(--ok)} #msg.dim{color:var(--dim)}
  video { width:100%; max-height:300px; background:#000; border-radius:10px; border:1px solid var(--line); }
  .kbd { font-size:11px; color:var(--dim); } .kbd b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>重剪时间轴 <span class="tag">clip 窗口裁剪 · 拖拽排序 · 拆分缝合 —— 编辑单 edit.json（P12-B）</span></h1>
  <div class="sub">在已出片的任务上「导入编辑单」，然后：<b>拖夹片中间=换序</b>、<b>拖左右边缘=裁剪</b>（0.1s 吸附）、<b>双击=在点处拆分</b>、Del 删除选中。产物导出走「保存后 → 控制台/本页导出精修」，<b>永不回写 shots.json</b>（语义归精修页，时间轴归这里）。<a href="/">入口</a> · <a href="/console">控制台</a> · <a href="/editor">✂ 精修</a> · <a href="/timeline">⇉ 排序</a></div>

  <div class="card">
    <div class="row">
      <div class="grow"><label>任务（需已有 timeline.json = 至少出过一次片）</label><select id="task"></select></div>
      <div><button class="mini" onclick="loadTask()">载入</button></div>
      <div><button class="mini" id="importBtn" onclick="importEdit()" disabled>① 导入编辑单</button></div>
      <div class="grow" id="stat" style="align-self:flex-end;min-height:30px"></div>
    </div>
  </div>

  <div class="card" id="pvCard" style="display:none">
    <label>预演（有导出记录=精修拼接流；否则=主链原片。裁剪/换序后的精确效果以「导出精修」为准）</label>
    <video id="pv" controls preload="metadata"></video>
  </div>

  <div class="card" id="tlCard" style="display:none">
    <div class="row" style="margin-bottom:8px">
      <div><button class="mini" id="undoBtn" onclick="undo()">↶ 撤销</button> <button class="mini" id="redoBtn" onclick="redo()">↷ 重做</button></div>
      <div class="grow"><label style="display:inline;margin-right:8px">缩放</label><input type="range" id="zoom" min="6" max="40" value="14" style="width:150px;accent-color:var(--accent)" oninput="render()"></div>
      <div class="kbd"><b>双击</b> 拆分 · <b>Del</b> 删除 · <b>Ctrl+Z / Ctrl+Shift+Z</b> 撤销/重做 · 边缘拖=裁剪 · 中间拖=换序</div>
    </div>
    <div class="tlwrap"><div class="tlbody" id="tlbody"></div></div>
  </div>

  <div class="card" id="inspCard" style="display:none">
    <h2 style="font-size:14px;margin-bottom:2px" id="inspTitle"></h2>
    <div class="insp">
      <div><label>进入转场</label><select id="pTr" onchange="setTr()"><option value="cut">硬切</option><option value="fade">交叉淡化 fade</option></select></div>
      <div><label>转场时长 s（0~2）</label><input type="number" id="pTrD" step="0.1" min="0" max="2" onchange="setTr()"></div>
      <div><label>窗口起 in（源秒）</label><input type="number" id="pIn" step="0.1" min="0" onchange="setInOut()"></div>
      <div><label>窗口止 out（源秒）</label><input type="number" id="pOut" step="0.1" min="0" onchange="setInOut()"></div>
    </div>
    <div class="hint" id="inspHint" style="margin-top:8px"></div>
    <div style="margin-top:8px"><button class="mini" onclick="splitSel()">✂ 从中间拆分</button> <button class="mini danger" onclick="delSel()">✕ 删除本 clip</button></div>
  </div>
</div>

<div id="bar"><div class="inner">
  <span id="msg" class="dim">先载入任务并导入编辑单</span>
  <span class="grow" style="flex:1"></span>
  <button class="mini" id="exportBtn" style="display:none" onclick="doExport()">▶ 导出精修（08+QC）</button>
  <button class="mini" id="relayBtn" style="display:none" onclick="doRelay()">📦 剪映接力包（干净底带+SRT）</button>
  <button class="primary" id="saveBtn" onclick="save(false)" disabled>保存编辑单</button>
  <button class="mini accent" id="saveGoBtn" onclick="save(true)" disabled>保存并导出</button>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
async function j(url, opt){ const r = await fetch(url, opt); const t = await r.json().catch(() => ({})); if (!r.ok) throw new Error(t.error || ('HTTP ' + r.status)); return t; }
const r3 = (x) => Number(x.toFixed(3));
const snap = (x) => Math.round(x * 10) / 10; // 0.1s 网格

let meta = null, tl = null, edit = null, clipSel = -1, hist = [], future = [], exportedAt = null, pollT = null;

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function commit() { hist.push(JSON.stringify(edit.clips)); if (hist.length > 80) hist.shift(); future.length = 0; }
function undo() { if (!hist.length) return; future.push(JSON.stringify(edit.clips)); edit.clips = JSON.parse(hist.pop()); clipSel = Math.min(clipSel, edit.clips.length - 1); renderAll(); }
function redo() { if (!future.length) return; hist.push(JSON.stringify(edit.clips)); edit.clips = JSON.parse(future.pop()); clipSel = Math.min(clipSel, edit.clips.length - 1); renderAll(); }

// —— 本地推导（与 edit-doc 同式，只算显示用的位置） ——
function positions() {
  const out = []; let cur = 0;
  edit.clips.forEach((c, i) => {
    const tr = i === 0 ? { type: 'cut', dur: 0 } : (c.transition || { type: 'cut', dur: 0 });
    const td = tr.type === 'fade' ? Number(tr.dur || 0) : 0;
    const dur = c.out - c.in;
    out.push({ start: r3(cur - td), end: r3(cur - td + dur), dur: r3(dur), tr: td });
    cur += dur - td;
  });
  return out;
}
function charAtTime(t) { // 源秒 → 字下标（charStart 升序表二分）
  const cs = tl.charStart; let lo = 0, hi = cs.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (cs[m] <= t + 1e-6) lo = m; else hi = m - 1; }
  return lo;
}
function shotOf(c) { return tl.shots[c.seg]; }
function charWin(c) { const s = shotOf(c); return [Math.max(s.charStart, c.charStart), Math.min(s.charEnd - 1, c.charEnd)]; }

// —— 操作 ——
function moveClip(from, to) {
  if (from === to) return;
  commit();
  const [c] = edit.clips.splice(from, 1);
  edit.clips.splice(to > from ? to - 1 : to, 0, c);
  // 换序后字符窗按新邻位重算（比例内插，保持窗口时长占比）
  const pos = positions();
  edit.clips.forEach((x, i) => {
    const s = shotOf(x), win = x.out - x.in;
    const ratio = win / Math.max(0.001, s.end - s.start);
    const src = charAtTime(x.in);
    let end = src; while (end < tl.charStart.length - 1 && tl.charStart[end] - tl.charStart[src] < win) end++;
    x.charStart = Math.max(s.charStart, Math.min(s.charEnd - 1, src));
    x.charEnd = Math.max(x.charStart, Math.min(s.charEnd - 1, end));
  });
  clipSel = to > from ? to - 1 : to;
  renderAll();
}
function trim(i, side, newSec) {
  const c = edit.clips[i], s = shotOf(c);
  commit();
  if (side === 'l') c.in = Math.max(r3(s.start), Math.min(newSec, c.out - 0.1));
  else c.out = Math.min(r3(s.end), Math.max(newSec, c.in + 0.1));
  const src = charAtTime(c.in);
  let end = src; while (end < tl.charStart.length - 1 && tl.charStart[end] - tl.charStart[src] < c.out - c.in) end++;
  c.charStart = Math.max(s.charStart, Math.min(s.charEnd - 1, src));
  c.charEnd = Math.max(c.charStart, Math.min(s.charEnd - 1, end));
  renderAll();
}
function splitAt(i, atSec) {
  const c = edit.clips[i], s = shotOf(c);
  if (atSec <= c.in + 0.1 || atSec >= c.out - 0.1) { msg('拆分点距边缘太近（两侧各需 ≥0.1s）', true); return; }
  commit();
  const cut = charAtTime(atSec);
  const left = { ...c, out: r3(atSec), charEnd: Math.min(c.charEnd, Math.max(c.charStart, cut - 1)) };
  const right = { ...c, id: 'c' + Date.now().toString(36).slice(-5), in: r3(atSec), charStart: Math.min(c.charEnd, Math.max(left.charEnd + 1, cut)), transition: { type: 'cut', dur: 0 } };
  if (right.charStart > right.charEnd) right.charEnd = right.charStart;
  edit.clips.splice(i, 1, left, right);
  clipSel = edit.clips.indexOf(right);
  renderAll();
  msg('已拆分为两个 clip（右半进入转场=硬切防重叠）');
}
function delClip(i) {
  if (edit.clips.length <= 1) { msg('至少保留一个 clip', true); return; }
  commit();
  edit.clips.splice(i, 1);
  if (i === 0) edit.clips[0].transition = { type: 'cut', dur: 0 };
  clipSel = Math.min(i, edit.clips.length - 1);
  renderAll();
}
function setTr() {
  if (clipSel < 0) return;
  commit();
  const c = edit.clips[clipSel];
  const type = $('pTr').value;
  c.transition = type === 'cut' ? { type: 'cut', dur: 0 } : { type: 'fade', dur: Math.min(2, Math.max(0.1, Number($('pTrD').value) || 0.5)) };
  if (clipSel === 0) c.transition = { type: 'cut', dur: 0 };
  renderAll();
}
function setInOut() {
  if (clipSel < 0) return;
  const c = edit.clips[clipSel], s = shotOf(c);
  commit();
  c.in = Math.max(r3(s.start), Math.min(Number($('pIn').value) || c.in, c.out - 0.1));
  c.out = Math.min(r3(s.end), Math.max(Number($('pOut').value) || c.out, c.in + 0.1));
  const src = charAtTime(c.in); let end = src;
  while (end < tl.charStart.length - 1 && tl.charStart[end] - tl.charStart[src] < c.out - c.in) end++;
  c.charStart = src; c.charEnd = Math.max(src, Math.min(s.charEnd - 1, end));
  renderAll();
}
function splitSel() { if (clipSel >= 0) { const c = edit.clips[clipSel]; splitAt(clipSel, r3(c.in + (c.out - c.in) / 2)); } }
function delSel() { if (clipSel >= 0) delClip(clipSel); }

// —— 渲染 ——
function renderAll() { render(); renderStat(); renderInsp(); }
function renderStat() {
  if (!edit) return;
  const pos = positions();
  const body = pos.length ? pos[pos.length - 1].end : 0;
  const dlt = body - tl.duration;
  $('stat').innerHTML = [
    `<span class="badge">${edit.clips.length} clip（源 ${tl.shots.length} 镜）</span>`,
    `<span class="badge">目标主体 ${body.toFixed(1)}s（原 ${tl.duration.toFixed(1)}s，${dlt >= 0 ? '+' : ''}${dlt.toFixed(1)}s）</span>`,
    exportedAt ? '<span class="badge ok">上次导出 ' + new Date(exportedAt).toLocaleString('zh-CN', { hour12: false }).slice(5, 16) + '</span>' : '<span class="badge warn">未导出</span>',
    hist.length ? `<span class="badge">${hist.length} 步可撤销</span>` : '',
  ].join('');
  $('undoBtn').disabled = !hist.length; $('redoBtn').disabled = !future.length;
}
function render() {
  if (!edit) { $('tlCard').style.display = 'none'; return; }
  $('tlCard').style.display = '';
  const pps = Number($('zoom').value);
  const pos = positions();
  const W = pos.reduce((a, p) => a + p.dur * pps, 0) + 8;
  const body = pos.length ? pos[pos.length - 1].end : 0;
  let ticks = ''; const step = pps >= 20 ? 2 : 5;
  for (let t = 0; t <= body; t += step) ticks += `<span class="tick" style="left:${t * pps}px">${t.toFixed(0)}s</span>`;
  const capText = (c) => {
    const chars = [];
    for (const cap of (tl.captions || [])) { (cap.idx || []).forEach((ci, k) => { if (ci >= c.charStart && ci <= c.charEnd) chars.push([...cap.text][k]); }); }
    return chars.join('').slice(0, 42) || '（无字幕）';
  };
  const clipHTML = (c, i, kind) => {
    const p = pos[i], s = shotOf(c), w = Math.max(26, p.dur * pps);
    const trTag = i > 0 && p.tr > 0 ? `<span class="trtag">fade ${p.tr}s</span><i class="tr" style="left:0"></i>` : '';
    if (kind === 'v') return `<div class="clip${i === clipSel ? ' sel' : ''}" data-ci="${i}" style="width:${w}px;height:64px">
      <div class="head"><span>#${i + 1} ${esc(s.id)}</span><span class="ty ty-${esc(s.type)}">${esc(s.type)}</span></div>
      <div class="cap">${c.src === 'asset' ? '📎 ' + esc(c.asset || '') : esc(s.asset ? '📎 ' + s.asset : (s.title || s.heading || s.keyword || s.note || s.quote || ''))}</div>
      ${trTag}<span class="foot">${p.dur.toFixed(1)}s</span><i class="grip l"></i><i class="grip r"></i></div>`;
    if (kind === 'c') return `<div class="clip${i === clipSel ? ' sel' : ''}" data-ci="${i}" style="width:${w}px;height:40px"><div class="cap" style="-webkit-line-clamp:2">${esc(capText(c))}</div></div>`;
    return `<div class="clip${i === clipSel ? ' sel' : ''}" data-ci="${i}" style="width:${w}px;height:34px">
      <div class="cap" style="line-height:26px;color:var(--dim);font-size:10px">${p.start.toFixed(1)}–${p.end.toFixed(1)}s · 字${c.charStart}–${c.charEnd}</div>${trTag}</div>`;
  };
  $('tlbody').innerHTML = `<div class="ruler">${ticks}</div>
    <div class="track"><span class="tracklab">口播</span><div class="clips" id="tkV">${edit.clips.map((c, i) => clipHTML(c, i, 'v')).join('')}</div></div>
    <div class="track"><span class="tracklab">配音</span><div class="clips">${edit.clips.map((c, i) => clipHTML(c, i, 'a')).join('')}</div></div>
    <div class="track"><span class="tracklab">字幕</span><div class="clips">${edit.clips.map((c, i) => clipHTML(c, i, 'c')).join('')}</div></div>
    <div class="caret" id="caret"></div><div class="playhead" id="ph"></div>`;
  bindGestures();
}
function renderInsp() {
  $('inspCard').style.display = clipSel >= 0 && edit ? '' : 'none';
  if (clipSel < 0 || !edit) return;
  const c = edit.clips[clipSel], s = shotOf(c), p = positions()[clipSel];
  $('inspTitle').textContent = `clip #${clipSel + 1} · 源镜 ${s.id}（${s.type}）`;
  $('pTr').value = clipSel === 0 ? 'cut' : ((c.transition || {}).type || 'cut');
  $('pTr').disabled = clipSel === 0;
  $('pTrD').value = (c.transition || {}).dur || 0.5;
  $('pIn').value = c.in.toFixed(2); $('pOut').value = c.out.toFixed(2);
  $('inspHint').textContent = `源镜窗口 [${s.start.toFixed(2)}, ${s.end.toFixed(2)}] · 当前裁剪 ${p.dur.toFixed(2)}s · 字符窗 [${c.charStart}, ${c.charEnd}]`
    + (clipSel === 0 ? ' · 首 clip 无进入转场' : '');
}

// —— 手势：中间拖=换序 / 边缘 grip 拖=裁剪 / 双击=拆分 ——
let g = null;
function bindGestures() {
  const main = $('tkV');
  main.querySelectorAll('.clip').forEach((el) => {
    el.addEventListener('pointerdown', (e) => {
      const i = +el.dataset.ci;
      const rect = el.getBoundingClientRect();
      const mode = e.clientX - rect.left < 12 ? 'trimL' : (rect.right - e.clientX < 12 ? 'trimR' : 'move');
      g = { i, mode, x0: e.clientX, rect, moved: false, el };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('dblclick', (e) => {
      const i = +el.dataset.ci, pps = Number($('zoom').value), pos = positions();
      const rect = el.getBoundingClientRect();
      const at = r3(edit.clips[i].in + (e.clientX - rect.left) / pps);
      splitAt(i, at);
    });
  });
  main.addEventListener('pointermove', (e) => {
    if (!g) return;
    const dx = e.clientX - g.x0;
    if (Math.abs(dx) > 3) g.moved = true;
    if (!g.moved) return;
    const pps = Number($('zoom').value);
    const caret = $('caret');
    if (g.mode === 'move') {
      g.el.classList.add('dragging');
      const kids = [...main.querySelectorAll('.clip')];
      let target = kids.length;
      for (let k = 0; k < kids.length; k++) { const r = kids[k].getBoundingClientRect(); if (e.clientX < r.left + r.width / 2) { target = k; break; } }
      g.target = target;
      const bodyL = $('tlbody').getBoundingClientRect();
      let cx;
      if (target >= kids.length) cx = kids[kids.length - 1].getBoundingClientRect().right - bodyL.left + 1;
      else cx = kids[target].getBoundingClientRect().left - bodyL.left - 1;
      caret.style.left = cx + 'px'; caret.style.display = 'block';
    } else {
      const c = edit.clips[g.i];
      const delta = dx / pps;
      const val = r3((g.mode === 'trimL' ? c.in : c.out) + delta);
      g.previewVal = snap(g.mode === 'trimL' ? Math.max(shotOf(c).start, val) : Math.min(shotOf(c).end, val));
      caret.style.display = 'none';
      const s = shotOf(c);
      const w = Math.max(26, (g.mode === 'trimL' ? (c.out - g.previewVal) : (g.previewVal - c.in)) * pps);
      g.el.style.width = w + 'px';
    }
  });
  main.addEventListener('pointerup', () => {
    if (!g) return;
    $('caret').style.display = 'none';
    g.el.classList.remove('dragging');
    if (!g.moved) { clipSel = g.i; renderAll(); g = null; return; }
    if (g.mode === 'move' && g.target != null) moveClip(g.i, g.target);
    else if ((g.mode === 'trimL' || g.mode === 'trimR') && g.previewVal != null) { hist.pop(); trim(g.i, g.mode === 'trimL' ? 'l' : 'r', g.previewVal); }
    else renderAll();
    g = null;
  });
}
window.addEventListener('keydown', (e) => {
  const tag = (document.activeElement || {}).tagName;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { if (tag === 'INPUT' || tag === 'TEXTAREA') return; e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === 'Delete' && clipSel >= 0 && tag !== 'INPUT' && tag !== 'TEXTAREA') delSel();
});

// —— 载入/导入/保存/导出 ——
async function init() {
  try {
    const tasks = await j('/api/tasks');
    $('task').innerHTML = tasks.length ? tasks.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('') : '<option value="">（还没有任务）</option>';
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash && tasks.some((t) => t.name === hash)) { $('task').value = hash; loadTask(); }
  } catch (e) { msg(e.message, true); }
}
async function loadTask() {
  const name = $('task').value; if (!name) return;
  try {
    const g = await j('/api/edit?name=' + encodeURIComponent(name));
    tl = {
      duration: g.timeline.duration, shots: g.timeline.shots,
      captions: g.timeline.captions || [], charStart: g.timeline.charStart || [], charEnd: g.timeline.charEnd || [],
      width: g.timeline.width, height: g.timeline.height, fps: g.timeline.fps,
    };
    if (!tl.captions.length || !tl.charStart.length) { msg('缺字幕/字级时间数据（任务需完整出过片）', true); return; }
    edit = g.edit ? clone(g.edit) : null; exportedAt = g.exportedAt;
    hist = []; future = []; clipSel = edit ? Math.min(clipSel < 0 ? 0 : clipSel, edit.clips.length - 1) : -1;
    history.replaceState(null, '', '#' + encodeURIComponent(name));
    $('importBtn').disabled = false;
    $('pv').src = '/file/' + encodeURIComponent(name) + '/' + encodeURIComponent(exportedAt ? '精修/成片.mp4' : '成片.mp4') + '?t=' + Date.now();
    $('pvCard').style.display = '';
    $('saveBtn').disabled = $('saveGoBtn').disabled = !edit;
    $('exportBtn').style.display = $('relayBtn').style.display = edit ? '' : 'none';
    if (edit) { renderAll(); msg('已载入：' + name + '（含编辑单，直接开剪）'); }
    else { $('tlCard').style.display = 'none'; $('stat').innerHTML = '<span class="badge">未导入编辑单</span>'; msg('任务已就绪，点「① 导入编辑单」开始重剪'); }
  } catch (e) { msg('载入失败：' + e.message, true); }
}
async function importEdit() {
  const name = $('task').value;
  try {
    const r = await j('/api/edit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, import: true }) });
    edit = r.edit; hist = []; future = []; clipSel = 0;
    renderAll(); msg('已从时间轴导入（一镜一 clip，全窗口）', false);
    $('saveBtn').disabled = $('saveGoBtn').disabled = false; $('exportBtn').style.display = $('relayBtn').style.display = '';
  } catch (e) { msg('导入失败：' + e.message, true); }
}
async function save(thenExport) {
  const name = $('task').value;
  try {
    await j('/api/edit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, edit }) });
    msg('✓ 编辑单已保存' + (thenExport ? '，开始导出…' : ''), false);
    if (thenExport) doExport();
  } catch (e) { msg('保存失败：' + e.message, true); }
}
async function doExport() {
  const name = $('task').value;
  try {
    await j('/api/rerun', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, from: 7, to: 8 }) });
    startPoll();
  } catch (e) { msg('导出排队失败：' + e.message, true); }
}
async function doRelay() {
  const name = $('task').value;
  msg('生成剪映接力包中（干净底带渲染 + SRT）…');
  try {
    const r = await j('/api/edit/jianying-package', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    msg(`✓ 接力包就绪：${r.files.join('、')}（剪映导入底带 + 「文本→本地字幕」导入 SRT）`);
  } catch (e) { msg('接力包失败：' + e.message, true); }
}
function startPoll() {
  msg('导出中（第 7 步渲染 → 第 8 步精修质检）…');
  if (pollT) return;
  pollT = setInterval(async () => {
    try {
      const s = await j('/api/status');
      if (s.running) { msg(`导出中：第 ${s.step}/8 ${s.stepName}`); return; }
      if (s.queue && s.queue.length) return;
      clearInterval(pollT); pollT = null;
      if (s.ok === false) { msg('导出失败，回控制台看日志', true); return; }
      exportedAt = new Date().toISOString();
      $('pv').src = '/file/' + encodeURIComponent($('task').value) + '/' + encodeURIComponent('精修/成片.mp4') + '?t=' + Date.now();
      msg('✓ 精修导出完成，预演已切换为精修成片');
      renderStat();
    } catch { }
  }, 1500);
}
function msg(m, isErr) { $('msg').textContent = m; $('msg').className = isErr ? 'err' : 'dim'; }

init();
</script>
